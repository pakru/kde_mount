name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate_packaging:
    name: Validate packaging and source gates
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run rootless metadata and source gates
        run: |
          bash tests/packaging_metadata_test.sh
          bash tests/package_scripts_test.sh
          bash tests/removed_api_gates.sh
          bash tests/qml_invokable_gate.sh

  build_deb:
    name: Build Ubuntu 26.04 DEB
    needs: validate_packaging
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:26.04@sha256:7b202b0e2e0028c6250f5fcf41d04df492d145a1654c6995a6553f0c1f6f1960
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Ubuntu build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            appstream binutils build-essential ca-certificates cmake debhelper devscripts \
            extra-cmake-modules file git jq libkf6auth-dev libkf6config-dev \
            libkf6coreaddons-dev libkf6i18n-dev libkf6kcmutils-dev \
            libkf6widgetsaddons-dev lintian qt6-base-dev qt6-declarative-dev systemd
          useradd --create-home --shell /bin/bash builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
      - name: Build and inspect DEB as an unprivileged user
        run: |
          mkdir -p artifacts logs
          chown builder:builder artifacts logs
          runuser -u builder -- ./packaging/build-deb.sh artifacts | tee logs/build-deb.log
          lintian --fail-on error artifacts/*.deb | tee logs/lintian.log
          dpkg-deb --info artifacts/*.deb > logs/dpkg-info.txt
          dpkg-deb --contents artifacts/*.deb > logs/dpkg-contents.txt
          dpkg-query -W > logs/build-packages.txt
      - name: Upload DEB and build evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package-ubuntu-26.04-amd64
          path: |
            artifacts/*.deb
            logs/
          if-no-files-found: error
          retention-days: 14

  build_rpm:
    name: Build Fedora 44 RPM
    needs: validate_packaging
    runs-on: ubuntu-24.04
    container:
      image: fedora:44@sha256:89f61a124414261868224666aa7fb8df1b78397a53623774bdfb105d1612b48b
    steps:
      - name: Install action runtime and build dependencies
        run: |
          dnf install -y --allowerasing --setopt=install_weak_deps=False \
            appstream binutils cmake cpio diffutils extra-cmake-modules file findutils \
            gcc-c++ git gzip jq kf6-kauth-devel kf6-kcmutils-devel \
            kf6-kconfig-devel kf6-kcoreaddons-devel kf6-ki18n-devel \
            kf6-kwidgetsaddons-devel qt6-qtbase-devel qt6-qtdeclarative-devel \
            rpm-build rpmlint systemd systemd-rpm-macros tar
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build and inspect RPM as an unprivileged user
        run: |
          useradd --create-home --shell /bin/bash builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          mkdir -p artifacts logs
          chown builder:builder artifacts logs
          runuser -u builder -- ./packaging/build-rpm.sh artifacts | tee logs/build-rpm.log
          rpmlint artifacts/*.rpm | tee logs/rpmlint.log
          rpm -qpi artifacts/*.rpm > logs/rpm-info.txt
          rpm -qpl artifacts/*.rpm > logs/rpm-files.txt
          rpm -qpR artifacts/*.rpm > logs/rpm-requires.txt
          rpm -qa > logs/build-packages.txt
      - name: Upload RPM and build evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package-fedora-44-x86_64
          path: |
            artifacts/*.rpm
            logs/
          if-no-files-found: error
          retention-days: 14

  smoke_packages:
    name: Smoke ${{ matrix.target }}
    needs: [build_deb, build_rpm]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: ubuntu-26.04-amd64
            family: deb
            image: ubuntu:26.04@sha256:7b202b0e2e0028c6250f5fcf41d04df492d145a1654c6995a6553f0c1f6f1960
            artifact: package-ubuntu-26.04-amd64
          - target: fedora-44-x86_64
            family: rpm
            image: fedora:44@sha256:89f61a124414261868224666aa7fb8df1b78397a53623774bdfb105d1612b48b
            artifact: package-fedora-44-x86_64
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Install smoke-test tools
        run: |
          if [ "${{ matrix.family }}" = deb ]; then
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              binutils file sudo
          else
            dnf install -y --allowerasing --setopt=install_weak_deps=False \
              binutils diffutils file sudo
          fi
      - name: Check out inspection scripts
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Download matching package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.artifact }}
          path: downloaded
      - name: Install, inspect, and remove package
        run: |
          mkdir -p logs
          if [ "${{ matrix.family }}" = deb ]; then
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              ./downloaded/artifacts/*.deb
            dpkg-query -L nasmount > logs/owned-paths.txt
            bash packaging/smoke-installed-package.sh deb "$(tr -d '[:space:]' < VERSION)" \
              | tee logs/inspection.txt
            install -d -m 0700 /etc/nasmount
            if DEBIAN_FRONTEND=noninteractive apt-get remove -y nasmount; then
              echo 'ERROR: DEB removal ignored managed state' >&2
              exit 1
            fi
            [ "$(dpkg-query -W -f='${db:Status-Status}' nasmount)" = installed ]
            rmdir /etc/nasmount
            DEBIAN_FRONTEND=noninteractive apt-get remove -y nasmount
            ! dpkg-query -s nasmount 2>/dev/null \
              | grep -q '^Status: install ok installed$'
          else
            dnf install -y --allowerasing --setopt=install_weak_deps=False \
              ./downloaded/artifacts/*.rpm
            rpm -ql nasmount > logs/owned-paths.txt
            bash packaging/smoke-installed-package.sh rpm "$(tr -d '[:space:]' < VERSION)" \
              | tee logs/inspection.txt
            rpm -qa --qf '%{NAME}-%{VERSION}-%{RELEASE}.%{ARCH}\n' | sort \
              > logs/rpm-packages-before-blocked-removal.txt
            install -d -m 0700 /etc/nasmount
            if dnf remove -y --no-autoremove nasmount; then
              echo 'ERROR: RPM removal ignored managed state' >&2
              exit 1
            fi
            rpm -q nasmount >/dev/null
            rpm -qa --qf '%{NAME}-%{VERSION}-%{RELEASE}.%{ARCH}\n' | sort \
              > logs/rpm-packages-after-blocked-removal.txt
            cmp logs/rpm-packages-before-blocked-removal.txt \
              logs/rpm-packages-after-blocked-removal.txt
            if ldd /usr/lib64/libexec/nasmount-package-guard | grep -q 'not found'; then
              echo 'ERROR: blocked RPM removal left the package guard unresolved' >&2
              exit 1
            fi
            if /usr/lib64/libexec/nasmount-package-guard; then
              echo 'ERROR: package guard accepted managed state after blocked removal' >&2
              exit 1
            fi
            rmdir /etc/nasmount
            dnf remove -y --no-autoremove nasmount
            ! rpm -q nasmount >/dev/null 2>&1
          fi
          printf '%s smoke install/removal passed\n' '${{ matrix.target }}' > logs/result.txt
      - name: Upload smoke report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: smoke-${{ matrix.target }}
          path: logs/
          if-no-files-found: error
          retention-days: 14

  verify_artifact_set:
    name: Verify two-package artifact set
    needs: smoke_packages
    runs-on: ubuntu-24.04
    steps:
      - name: Check out verification scripts
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install cross-package inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cpio file jq rpm
      - name: Download both packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: package-*
          path: downloaded
          merge-multiple: true
      - name: Verify package set and generate metadata
        run: |
          mkdir packages metadata verified
          find downloaded -maxdepth 2 -type f \( -name '*.deb' -o -name '*.rpm' \) -exec cp {} packages/ \;
          ./packaging/verify-artifact-set.sh packages metadata
          cp packages/* metadata/* verified/
      - name: Upload verified candidate release set
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verified-native-packages
          path: verified/
          if-no-files-found: error
          retention-days: 14

  ci_success:
    name: Required CI result
    if: always()
    needs: [validate_packaging, build_deb, build_rpm, smoke_packages, verify_artifact_set]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every CI stage
        env:
          VALIDATE: ${{ needs.validate_packaging.result }}
          DEB: ${{ needs.build_deb.result }}
          RPM: ${{ needs.build_rpm.result }}
          SMOKE: ${{ needs.smoke_packages.result }}
          VERIFY: ${{ needs.verify_artifact_set.result }}
        run: |
          for result in "$VALIDATE" "$DEB" "$RPM" "$SMOKE" "$VERIFY"; do
            [ "$result" = success ] || exit 1
          done
          echo "Ubuntu 26.04 DEB and Fedora 44 RPM passed all required CI stages."
